name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate tagged commit
    uses: ./.github/workflows/ci.yml

  release:
    name: goreleaser
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate verified Homebrew formula
        run: go run ./scripts/homebrew -version "$RELEASE_TAG" -repository "$RELEASE_REPOSITORY"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}

      - name: Save verified Homebrew formula
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-formula-${{ github.ref_name }}
          path: dist/homebrew/bb.rb
          if-no-files-found: error
          retention-days: 14

  homebrew:
    name: Update Homebrew tap
    # The public tap cannot install assets from a private source repository.
    if: github.event.repository.private == false
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check automatic tap publishing credentials
        id: tap
        shell: bash
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tap token is not configured. Publish the verified homebrew-formula artifact using maintainer access."
          fi

      - name: Retrieve verified Homebrew formula
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homebrew-formula-${{ github.ref_name }}
          path: homebrew-formula

      - name: Check out Homebrew tap
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'bitbucket-cli/homebrew-tap' }}
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
          # Used only for the tap push below; checkout cleans credentials afterward.
          persist-credentials: true

      - name: Update Homebrew formula
        if: steps.tap.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          formula=Formula/bb.rb
          if [ -L homebrew-tap/bb.rb ] || [ -L homebrew-tap/Formula ] || [ -L homebrew-tap/Formula/bb.rb ]; then
            echo "Refusing to replace a formula or directory symlink." >&2
            exit 1
          fi
          if [ -f homebrew-tap/bb.rb ] && [ -f homebrew-tap/Formula/bb.rb ]; then
            echo "Tap contains both bb.rb and Formula/bb.rb; resolve the duplicate first." >&2
            exit 1
          fi
          if [ -f homebrew-tap/bb.rb ]; then
            formula=bb.rb
          fi
          mkdir -p "homebrew-tap/$(dirname "$formula")"
          cp homebrew-formula/bb.rb "homebrew-tap/$formula"
          git -C homebrew-tap add -- "$formula"
          if git -C homebrew-tap diff --cached --quiet; then
            exit 0
          fi
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap commit -m "bb: update to $RELEASE_TAG"
          branch="$(git -C homebrew-tap symbolic-ref --short HEAD)"
          git -C homebrew-tap push origin "HEAD:refs/heads/$branch"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
