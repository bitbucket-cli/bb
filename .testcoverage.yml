# Package ratchets below the measured baseline; raise them as coverage improves.
# Paths are relative to the module root, as normalized by go-test-coverage.
profile: coverage.out
exclude:
  paths:
    - ^generated/
    - ^scripts/
threshold:
  file: 0
  package: 65
  total: 65
override:
  - path: ^cmd/bb$
    threshold: 65
  - path: ^pkg/auth$
    threshold: 77
  - path: ^internal/config$
    threshold: 90
  - path: ^internal/output$
    threshold: 91
  # Interactive terminal prompts currently have no direct automated coverage.
  # Keep their uncovered statements in the total rather than excluding them.
  - path: ^internal/interactive$
    threshold: 0
