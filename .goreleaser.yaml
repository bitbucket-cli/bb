version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: bb
    main: ./cmd/bb
    binary: bb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "bb_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: bb
    repository:
      owner: ThomasRedstone
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/ThomasRedstone/bb
    description: Bitbucket CLI — manage repositories, pull requests, and pipelines from your terminal
    license: MIT
    install: bin.install "bb"
    test: system "#{bin}/bb", "--version"

# Windows Scoop manifest. Requires a ThomasRedstone/scoop-bucket repo and a
# SCOOP_BUCKET_GITHUB_TOKEN secret (mirrors the Homebrew tap setup above).
scoops:
  - repository:
      owner: ThomasRedstone
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://github.com/ThomasRedstone/bb
    description: Bitbucket CLI — manage repositories, pull requests, and pipelines from your terminal
    license: MIT

# Linux packages (.deb / .rpm). Self-contained artifacts — no external repo
# needed; published as release assets.
nfpms:
  - id: packages
    package_name: bb
    vendor: Thomas Redstone
    homepage: https://github.com/ThomasRedstone/bb
    maintainer: Thomas Redstone <thomas@redstone.me.uk>
    description: Bitbucket CLI — manage repositories, pull requests, and pipelines from your terminal
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
