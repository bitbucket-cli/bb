version: 2

before:
  hooks:
    - go mod verify
    - go run ./scripts/licenses
    - git diff --exit-code -- THIRD_PARTY_LICENSES.txt

builds:
  - id: bb
    main: ./cmd/bb
    binary: bb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "bb_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_LICENSES.txt

# Release-candidate tags remain visibly marked previews; stable tags keep normal
# release behavior. GitHub does not treat prereleases as the latest stable release.
release:
  prerelease: auto
  make_latest: "{{ if .Prerelease }}false{{ else }}true{{ end }}"
  name_template: "{{ .Tag }}{{ if .Prerelease }} — Public preview{{ end }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# Homebrew formula generation/publishing is handled by scripts/homebrew and
# .github/workflows/release.yml to preserve macOS and Linux tap installs.

# Windows Scoop manifest — DISABLED for v1. To enable: create a
# ThomasRedstone/scoop-bucket repo, add a SCOOP_BUCKET_GITHUB_TOKEN secret and
# pass it through in .github/workflows/release.yml, then uncomment this block.
# (Windows users can still `go install` or download the release binary.)
# scoops:
#   - repository:
#       owner: ThomasRedstone
#       name: scoop-bucket
#       token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
#     homepage: https://github.com/bitbucket-cli/bb
#     description: Bitbucket CLI — manage repositories, pull requests, and pipelines from your terminal
#     license: MIT

# Linux packages (.deb / .rpm). Self-contained artifacts — no external repo
# needed; published as release assets.
nfpms:
  - id: packages
    package_name: bb
    vendor: Thomas Redstone
    homepage: https://github.com/bitbucket-cli/bb
    maintainer: Thomas Redstone <thomas@redstone.me.uk>
    description: Bitbucket CLI — manage repositories, pull requests, and pipelines from your terminal
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/bb/LICENSE
      - src: THIRD_PARTY_LICENSES.txt
        dst: /usr/share/doc/bb/THIRD_PARTY_LICENSES.txt
